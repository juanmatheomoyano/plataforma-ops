name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — alembic + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Config mínima para que Settings() no falle
      APP_SECRET_KEY: ci-app-secret-key
      JWT_SECRET_KEY: ci-jwt-secret
      FERNET_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      VTEX_ACCOUNT: ci-account
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alembic upgrade head (aplica todas las migraciones)
        working-directory: backend
        run: alembic upgrade head

      - name: Alembic check (modelos SQLAlchemy vs schema migrado)
        working-directory: backend
        run: alembic check

      - name: Pytest
        working-directory: backend
        run: pytest -v --tb=short

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Vite build (sin tauri — solo para verificar que compila)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.example.com/api
          VITE_APP_VERSION: ci
