name: Reset passwords (one-off)
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bcrypt==4.2.1 psycopg2-binary
      - name: Reset passwords
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          python - <<'EOF'
          import os, psycopg2, bcrypt

          new_hash = bcrypt.hashpw(b"Cambiar123", bcrypt.gensalt(rounds=12)).decode()

          users = [
            'mtarnaiz','matanasio','macabrera','dbarboza','aferreri',
            'pquiquinto','lczanone','msabater','mmontanez','gvmarin',
            'lssuarez','jbpavia','fcarrizo','ncevela',
          ]

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute(
            "UPDATE users SET hashed_password = %s WHERE username = ANY(%s) RETURNING username",
            (new_hash, users)
          )
          updated = [r[0] for r in cur.fetchall()]
          conn.commit()
          cur.close()
          conn.close()
          print(f"Actualizados ({len(updated)}): {', '.join(sorted(updated))}")
          not_found = set(users) - set(updated)
          if not_found:
            print(f"No encontrados: {', '.join(sorted(not_found))}")
          EOF
