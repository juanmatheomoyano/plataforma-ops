name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Sign installer
        id: sign
        shell: pwsh
        env:
          KEY_CONTENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exePath = (Get-ChildItem "frontend\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1).FullName
          $sigPath = "$exePath.sig"

          # Si el auto-sign ya generó el .sig, usarlo. Si no, firmar manualmente.
          if (-not (Test-Path $sigPath)) {
            $keyFile = Join-Path $env:RUNNER_TEMP "tauri-signing.key"
            Set-Content -Path $keyFile -Value $env:KEY_CONTENT -Encoding utf8 -NoNewline
            npx --yes @tauri-apps/cli@2 signer sign -p $env:KEY_PASSWORD -f $keyFile $exePath
            Remove-Item $keyFile -ErrorAction SilentlyContinue
          }

          $sig = (Get-Content $sigPath -Raw).Trim()
          $info = Get-Content "backend\release_info.json" | ConvertFrom-Json

          echo "exe_path=$exePath" >> $env:GITHUB_OUTPUT
          echo "sig_path=$sigPath" >> $env:GITHUB_OUTPUT
          echo "signature=$sig" >> $env:GITHUB_OUTPUT
          echo "notes=$($info.notes)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.sign.outputs.notes }}
          files: |
            ${{ steps.sign.outputs.exe_path }}
            ${{ steps.sign.outputs.sig_path }}

      - name: Update release_info.json and push
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $info = Get-Content "backend\release_info.json" | ConvertFrom-Json
          $info.version = $version
          $info.signature = "${{ steps.sign.outputs.signature }}"
          $info.pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          $info | ConvertTo-Json -Depth 5 | Set-Content "backend\release_info.json" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/release_info.json
          git commit -m "chore: release_info.json ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main
